services:
  # ───────────────────────────────
  #  PostgreSQL Database
  # ───────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -q"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ───────────────────────────────
  #  Spring Boot Backend (API)
  # ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    # optional for debugging:
    # command: ["java", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005", "-jar", "app.jar"]
    # ports:
    #   - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    #   - "5005:5005"

  # ───────────────────────────────
  #  React Frontend (nginx)
  # ───────────────────────────────
  frontend:
    build:
      context: ./course_planner_frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    volumes:
      - ./course_planner_frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro


volumes:
  postgres_data:
