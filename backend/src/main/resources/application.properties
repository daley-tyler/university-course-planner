spring.application.name=course-planner-api

# --- Database Connection ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:course_planner_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# Use validate so Hibernate checks that Flyway's schema matches the entity model
spring.jpa.hibernate.ddl-auto=validate


# No Show SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR
logging.level.org.flywaydb=ERROR

# App logging
logging.level.com.courseplanner.api=INFO
logging.level.com.courseplanner.api.Bulletin=DEBUG
logging.level.com.courseplanner.api.Courses=DEBUG
# Log file location (picked up by logback-spring.xml)
logging.file.path=logs

# Dialect (optional; Boot 3+ auto-detects, but harmless to keep)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Spring Session (JDBC) ---
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# --- Session Cookie ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=SESSION

# --- Trust nginx X-Forwarded headers ---
server.forward-headers-strategy=native

# --- CAS ---
cas.provider.key=${CAS_PROVIDER_KEY:local-dev-key}
cas.service.url=${CAS_SERVICE_URL:http://localhost:8080}
cas.login.url=${CAS_LOGIN_URL:https://login.example.edu/cas/login}
cas.validate.url=${CAS_VALIDATE_URL:https://login.example.edu/cas/serviceValidate}
cas.user.email.domain=${CAS_USER_EMAIL_DOMAIN:example.edu}

# --- Catalog Integrations ---
course.catalog.base-url=${COURSE_CATALOG_BASE_URL:https://catalog.example.edu/courselist/}
bulletin.current-root=${BULLETIN_CURRENT_ROOT:https://catalog.example.edu}
bulletin.archive-root=${BULLETIN_ARCHIVE_ROOT:https://catalog.example.edu/archive/}
